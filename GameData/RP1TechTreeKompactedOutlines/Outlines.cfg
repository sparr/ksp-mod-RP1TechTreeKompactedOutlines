// Outlines drawn behind the R&D tech tree by RP1TechTreeKompactedOutlines.
//
// The blue sky techs are the ones RP-1 types as Materials or Electronics. The
// ones in the same column open one era, in the color of their icons' frames.
// The era spans from that column to the start of the next era. Each blue sky
// tech gets a box around itself and the techs in that span that depend on it,
// directly or through other techs. A tech inside a box that does not depend on
// its blue sky tech is cut out of the box's left side. A tech that requires a
// blue sky tech directly but sits in a later era's columns is reached by a tab
// out of the right side of that tech's box.
//
// Every other tech has the colored frame removed from its icon.
RP1_TECHTREE_KOMPACTED_OUTLINES:NEEDS[RP1KompactedTechTree]
{
	// All sizes are in tech tree units. Most nodes are 56 wide.
	thickness = 2
	// Space between the techs and the box around them.
	padding = 7
	cornerRadius = 10
	// Space left around a tech that is cut out of a box.
	cutoutGap = 5
	// Space around a tech that a box reaches out to. Smaller than cutoutGap so
	// the tab fits inside the notch the neighboring box leaves for it.
	bumpPadding = 2
	// Opacity of the line.
	lineAlpha = 0.9
}
